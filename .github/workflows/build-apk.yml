name: Build Native Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Initialize Flutter Android Wrapper & Get Dependencies
        run: |
          cd mobile
          flutter create . --org com.mapstudio --project-name map_studio_gis --platforms android
          flutter pub get

      - name: Build Flutter Release APK (Direct GPU Engine)
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload Native Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapStudio-Flutter-GIS-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
